<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Payroll Management System</title>
<style>
:root{--ac:#2563eb}*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b}
#side{position:fixed;left:0;top:0;bottom:0;width:240px;background:linear-gradient(180deg,#0b1f3a,#0f2a4a);color:#fff;padding:0 10px 14px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:16px 6px;border-bottom:1px solid #ffffff22;margin-bottom:6px}.logo span{font-size:24px;background:var(--ac);border-radius:10px;padding:4px 8px}.logo small{display:block;color:#94a3b8;font-size:11px}
#side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;margin:2px 0}#side a:hover{background:#ffffff14;color:#fff}#side a.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px #2563eb66}
.sec{font-size:10px;letter-spacing:1px;color:#64748b;margin:14px 8px 4px}
#main{margin-left:240px}#top{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;box-shadow:0 1px 4px #0001}
#crumb{color:#64748b;flex:1}#gs{max-width:300px;margin:0}.bell{position:relative;cursor:pointer;font-size:20px}.bell i{position:absolute;top:-6px;right:-9px;background:#dc2626;color:#fff;font:700 10px sans-serif;border-radius:10px;padding:2px 5px;font-style:normal}
.um{position:relative;display:flex;gap:8px;align-items:center;cursor:pointer}.menu{display:none;position:absolute;right:0;top:46px;background:#fff;border-radius:8px;box-shadow:0 4px 18px #0003;min-width:180px;overflow:hidden}.menu.show{display:block}.menu a{display:block;padding:10px 14px;color:#1e293b}.menu a:hover{background:#f1f5f9}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;object-fit:cover;flex:none}
#page{padding:22px}h2{margin:0 0 14px;color:#0f2a4a}h3{margin:6px 0 10px;color:#0f2a4a}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.kpi{background:#fff;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px #0001;color:#64748b}.kpi b{display:block;font-size:20px;color:#0f2a4a}.ki{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#0f2a4a;color:#fff;font-weight:600;font-size:12px;text-transform:uppercase}th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}tbody tr:hover{background:#eff6ff}
.b{background:var(--ac);color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;margin:2px;font-size:13px}.b:hover{filter:brightness(1.1)}.g{background:#64748b}.r{background:#dc2626}.ok{background:#16a34a}
input,select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;width:100%;margin:3px 0 8px;font:inherit}input:focus,select:focus{outline:2px solid #93c5fd}.inl{width:auto;display:inline-block;margin:0 6px 0 0}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px;z-index:9}#modal>div{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:640px}
.err{color:#dc2626}#toast{position:fixed;right:16px;top:16px;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99;box-shadow:0 4px 12px #0004}
.bar{background:#3b82f6;height:14px;border-radius:4px}.tag{padding:2px 10px;border-radius:10px;background:#e2e8f0;font-size:12px;font-weight:600}.t1{background:#dcfce7;color:#166534}.t2{background:#fef3c7;color:#92400e}.t3{background:#fee2e2;color:#991b1b}
.tr{text-align:right}.tw{overflow:auto}.bars{display:flex;gap:10px;align-items:flex-end;height:170px}
.lg{display:flex;min-height:100vh}.lg .l{flex:1;background:linear-gradient(135deg,#0b1f3a,#1d4ed8);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center}.lg .l li{margin:8px 0;color:#dbeafe}.lg .r{width:460px;display:flex;align-items:center;justify-content:center;background:#fff;padding:30px}.lg .r>div{width:100%}
.pw{position:relative}.pw span{position:absolute;right:10px;top:9px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{background:#fff;border:1px solid #e2e8f0;min-height:84px;padding:4px;font-size:11px;border-radius:6px}.ch{font-weight:700;text-align:center;color:#64748b}
.ev{border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ev.ok{background:#dcfce7}.ev.wa{background:#fef3c7}.ev.rd{background:#fee2e2}.ev.bi{background:#ede9fe}
@media(max-width:800px){#side{position:static;width:auto}#main{margin:0}.lg{flex-direction:column}.lg .r{width:auto}.lg .l{padding:30px}}
@media print{#top,.np,#toast{display:none!important}body>*:not(#modal){display:none}#modal{position:static;display:block!important;background:none;padding:0}#modal>div{box-shadow:none;max-width:100%}}
</style>
</head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const K='payrollDB3';let db=JSON.parse(localStorage.getItem(K)||'null'),me=JSON.parse(sessionStorage.getItem('me')||'null'),cur='dash',pm=new Date().toISOString().slice(0,7),am=pm;
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'h'+h};
const m=x=>Math.round((x+Number.EPSILON)*100)/100,$$=x=>db.set.cur+' '+m(+x).toLocaleString('en-IN',{minimumFractionDigits:2});
const save=()=>{localStorage.setItem(K,JSON.stringify(db));if(typeof syncRDB=='function')syncRDB()};
const nid=t=>db[t].reduce((a,x)=>Math.max(a,x.id),0)+1;
const add=(t,o)=>{o.id=nid(t);db[t].push(o);save();return o};
const log=a=>{add('audit',{t:new Date().toLocaleString(),u:me?me.name:'-',a})};
const toast=(t,bad)=>{const x=$('#toast');x.textContent=t;x.style.background=bad?'#dc2626':'#16a34a';x.style.display='block';setTimeout(()=>x.style.display='none',2500)};
const en=id=>{const e=db.emp.find(x=>x.id==id);return e?e.code+' - '+e.name:'?'};
const dn=id=>(db.dept.find(d=>d.id==id)||{}).name||'-';
const isA=()=>me&&me.role=='admin';
if(!db){db={set:{co:'Acme Pvt Ltd',addr:'Meerut, Uttar Pradesh',ph:'0121-0000000',cur:'Rs.',pf:12,esi:0.75,pt:200,wd:26,cl:12,sl:12,el:15},users:[{id:1,u:'admin',name:'Administrator',pw:H('admin123')}],dept:[],emp:[],att:[],leave:[],sal:[],ded:[],pay:[],audit:[],reimb:[],seeded:0};
['Engineering:Developer,Tester','HR:HR Executive','Sales:Sales Executive'].forEach(x=>{const[a,b]=x.split(':');add('dept',{name:a,desigs:b})});
[['Rahul Sharma','rahul@demo.com',1,'Developer',30000],['Anita Verma','anita@demo.com',2,'HR Executive',25000],['Vikas Singh','vikas@demo.com',3,'Sales Executive',22000]].forEach(([n,e,d,g,b])=>{const x=add('emp',{name:n,email:e,phone:'9876543210',address:'Meerut',joined:'2025-04-01',dept:d,desig:g,status:'Active',pw:H('emp123')});x.code='EMP'+String(x.id).padStart(3,'0');
add('sal',{emp:x.id,basic:b,hra:b*.4,med:1250,ta:1600,da:b*.1,oth:2000,bonus:0,otr:200,eff:'2025-04-01'})});save()}
// ---------- calc ----------
const sal=(id,mo)=>db.sal.filter(s=>s.emp==id&&(!mo||s.eff<=mo+'-31')).sort((a,b)=>a.eff<b.eff?1:a.eff>b.eff?-1:b.id-a.id)[0];
const days=(f,t)=>Math.round((new Date(t)-new Date(f))/864e5)+1;
function lvDays(id,mo,type){let n=0;db.leave.filter(l=>l.emp==id&&l.st=='Approved'&&(!type||l.type==type)).forEach(l=>{for(let d=new Date(l.from);d<=new Date(l.to);d.setUTCDate(d.getUTCDate()+1))if(d.toISOString().slice(0,7)==mo)n++});return n}
function calc(e,mo){const s=sal(e.id,mo);if(!s)return null;const S=db.set,A=db.att.filter(a=>a.emp==e.id&&a.date.startsWith(mo));
const ab=A.filter(a=>a.st=='Absent').length+A.filter(a=>a.st=='Half Day').length/2,ot=A.reduce((t,a)=>t+ +a.ot,0),ul=lvDays(e.id,mo,'Unpaid');
const base=['basic','hra','med','ta','da','oth'].reduce((t,k)=>t+ +s[k],0),otp=m(ot*s.otr),gross=m(base+ +s.bonus+otp),pd=m(base/S.wd),unp=m(pd*(ab+ul));
const fd=m(+s.od||0),pf=m(s.basic*S.pf/100),esi=gross<=21000?m(gross*S.esi/100):0,pt=+S.pt,D=db.ded.filter(d=>d.emp==e.id&&d.mo==mo),sm=t=>m(D.filter(d=>d.type==t).reduce((a,d)=>a+ +d.amt,0));
const tds=sm('TDS'),loan=sm('Loan'),adv=sm('Advance'),oth=sm('Other'),td=m(unp+pf+esi+pt+tds+loan+adv+oth+fd),rb=m(db.reimb.filter(x=>x.emp==e.id&&x.mo==mo&&x.st=='Approved').reduce((a,x)=>a+ +x.amt,0));
return{s:{...s},ot,otp,ab,ul,pd,gross,unp,pf,esi,pt,fd,tds,loan,adv,oth,td,reimb:rb,net:m(gross-td+rb)}}
// ---------- ui helpers ----------
function modal(h){$('#modal').style.display='flex';$('#modal').innerHTML='<div>'+h+'</div>'}
function closeM(){$('#modal').style.display='none';$('#modal').innerHTML='';go(cur)}
let _cb;function form(title,fs,v,cb){v=v||{};_cb=cb;modal(`<h3>${title}</h3><form id="f" onsubmit="return false">`+fs.map(f=>`<label>${f.l}`+(f.t=='select'?`<select name="${f.n}">${f.o.map(o=>`<option value="${E(o[0])}" ${o[0]==v[f.n]?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input name="${f.n}" type="${f.t||'text'}" step="any" value="${E(v[f.n]??'')}">`)+'</label>').join('')+`<p id="err" class="err"></p><button class="b" onclick="subm()">Save</button><button class="b g" onclick="closeM()">Cancel</button></form>`)}
function subm(){const o={};new FormData($('#f')).forEach((x,k)=>o[k]=x.trim());const r=_cb(o);if(r)$('#err').textContent=r;else{save();toast('Saved successfully');closeM()}}
const fl=i=>{const q=i.value.toLowerCase();i.closest('.card').querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')};
const tbl=(h,rows,s)=>`${s?'<input placeholder="Search..." oninput="fl(this)" style="max-width:260px">':''}<div class="tw"><table><thead><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')||`<tr><td colspan="${h.length}">No records</td></tr>`}</tbody></table></div>`;
const btn=(t,f,c)=>`<button class="b ${c||''}" onclick="${f}">${t}</button>`;
function csv(name,rows){const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'.csv';a.click()}
const opts=(a,f)=>a.map(x=>[x.id,f(x)]);const actE=()=>opts(db.emp.filter(e=>e.status=='Active'),e=>e.code+' - '+e.name);
// ---------- auth ----------
function login(){const i=$('#li').value.trim().toLowerCase(),p=H($('#lp').value);let u=db.users.find(x=>x.u==i&&x.pw==p);
if(u)me={role:'admin',id:u.id,name:u.name};else{const e=db.emp.find(x=>x.email.toLowerCase()==i&&x.pw==p);if(!e)return $('#le').textContent='Invalid username/email or password';if(e.status!='Active')return $('#le').textContent='Account inactive. Contact admin.';me={role:'emp',id:e.id,name:e.name}}
sessionStorage.setItem('me',JSON.stringify(me));cur=isA()?'dash':'prof';log('Login');boot()}
function logout(){log('Logout');me=null;sessionStorage.removeItem('me');boot()}
function pwForm(){form('Change Password',[{n:'o',l:'Current password',t:'password'},{n:'n',l:'New password (min 6)',t:'password'}],{},o=>{const r=isA()?db.users.find(x=>x.id==me.id):db.emp.find(x=>x.id==me.id);if(r.pw!=H(o.o))return'Current password wrong';if(o.n.length<6)return'Password too short';r.pw=H(o.n);log('Password changed')})}
function boot(){if(!me){$('#app').innerHTML=`<div class="card login"><h2>Payroll Management</h2><p>Username / Email</p><input id="li"><p>Password</p><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><p id="le" class="err"></p>${btn('Login','login()')}<p style="font-size:12px;color:#64748b">Demo: admin / admin123 &nbsp;|&nbsp; rahul@demo.com / emp123<br>Forgot password? Ask admin to reset it.</p></div>`;return}
const nav=isA()?[['dash','Dashboard'],['emp','Employees'],['dept','Departments'],['att','Attendance'],['leave','Leave'],['sal','Salary Structure'],['ded','Deductions'],['pay','Payroll'],['hist','Payroll History'],['reimb','Reimbursements'],['rep','Reports'],['set','Settings']]:[['prof','My Profile'],['att','My Attendance'],['leave','My Leave'],['slips','Salary & Payslips'],['reimb','My Reimbursements']];
$('#app').innerHTML=`<div id="side"><h2>${E(db.set.co)}</h2><small>${E(me.name)} (${me.role})</small><br><br>${nav.map(n=>`<a id="n_${n[0]}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}<a onclick="pwForm()">Change Password</a><a onclick="logout()">Logout</a></div><div id="main"></div>`;go(cur)}
function go(p){cur=p;document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.id=='n_'+p));$('#main').innerHTML=P[p]()}
// ---------- pages ----------
const P={};
P.dash=()=>{const f=db.pay.filter(p=>p.st=='Final'&&p.mo==pm),sum=k=>m(f.reduce((a,p)=>a+(p.c[k]||0),0)),ac=db.emp.filter(e=>e.status=='Active').length,mx=Math.max(1,...db.dept.map(d=>db.emp.filter(e=>e.dept==d.id).length));
const ds={};f.forEach(p=>ds[p.dept]=m((ds[p.dept]||0)+p.c.gross));
return`<h2>Dashboard</h2><p>Month: <input class="inl" type="month" value="${pm}" onchange="pm=this.value;go('dash')" style="width:170px"></p><div class="grid">
<div class="kpi">Total Employees<b>${db.emp.length}</b></div><div class="kpi">Active / Inactive<b>${ac} / ${db.emp.length-ac}</b></div><div class="kpi">Departments<b>${db.dept.length}</b></div>
<div class="kpi">Salary Expenditure (Gross)<b>${$$(sum('gross'))}</b></div><div class="kpi">Total Deductions<b>${$$(sum('td'))}</b></div><div class="kpi">Net Paid<b>${$$(sum('net'))}</b></div><div class="kpi">Payrolls Processed<b>${f.length}</b></div></div><br>
<div class="card"><h3>Department-wise Employees</h3>${db.dept.map(d=>{const n=db.emp.filter(e=>e.dept==d.id).length;return`<p>${E(d.name)} (${n})<div class="bar" style="width:${n/mx*100}%"></div></p>`}).join('')}</div>
<div class="card"><h3>Department-wise Salary Expenditure (${pm})</h3>${tbl(['Department','Gross'],Object.entries(ds).map(([k,v])=>[E(k),$$(v)]))}</div>
<div class="card"><h3>Recently Added Employees</h3>${tbl(['ID','Name','Dept','Joined'],db.emp.slice(-5).reverse().map(e=>[e.code,E(e.name),E(dn(e.dept)),e.joined]))}</div>`};
// employees
const empF=()=>[{n:'name',l:'Full Name'},{n:'email',l:'Email',t:'email'},{n:'phone',l:'Phone'},{n:'address',l:'Address'},{n:'dob',l:'Date of Birth',t:'date'},{n:'emerg',l:'Emergency Contact Name'},{n:'ephone',l:'Emergency Contact Phone'},{n:'joined',l:'Joining Date',t:'date'},{n:'dept',l:'Department',t:'select',o:opts(db.dept,d=>d.name)},{n:'desig',l:'Designation'},{n:'status',l:'Status',t:'select',o:[['Active','Active'],['Inactive','Inactive']]}];
function empChk(o,id){if(!o.name||!o.joined||!o.dept)return'Name, joining date and department required';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))return'Invalid email';if(db.emp.some(e=>e.email.toLowerCase()==o.email.toLowerCase()&&e.id!=id))return'Email already exists';if(o.phone&&!/^\d{10}$/.test(o.phone))return'Phone must be 10 digits';if(o.dob&&o.dob>=new Date().toISOString().slice(0,10))return'Invalid date of birth';if(o.ephone&&!/^\d{10}$/.test(o.ephone))return'Emergency phone must be 10 digits'}
function empAdd(){form('Add Employee',empF().concat([{n:'pw',l:'Initial password',t:'text'}]),{pw:'emp123',status:'Active'},o=>{const r=empChk(o);if(r)return r;const pw=o.pw||'emp123';delete o.pw;o.dept=+o.dept;const x=add('emp',{...o,pw:H(pw)});x.code='EMP'+String(x.id).padStart(3,'0');log('Added '+x.code);alert('Employee created successfully.\nLogin ID: '+x.code+' (or email)\nPassword: '+pw+'\nShare these with the employee for the Employee Login.');setTimeout(()=>salF(x.id),150)})}
function empEdit(id){const e=db.emp.find(x=>x.id==id);form('Edit '+e.code,empF(),e,o=>{const r=empChk(o,id);if(r)return r;o.dept=+o.dept;Object.assign(e,o);log('Edited '+e.code)})}
function empTog(id){const e=db.emp.find(x=>x.id==id);e.status=e.status=='Active'?'Inactive':'Active';save();log('Status '+e.code);go('emp')}
function empDel(id){const e=db.emp.find(x=>x.id==id);if(db.pay.some(p=>p.emp==id)||db.att.some(a=>a.emp==id))return toast('Has records - deactivate instead',1);if(confirm('Delete '+e.name+'?')){db.emp=db.emp.filter(x=>x.id!=id);db.sal=db.sal.filter(x=>x.emp!=id);db.leave=db.leave.filter(x=>x.emp!=id);save();go('emp')}}
function empRst(id){if(confirm('Reset password to welcome123?')){db.emp.find(x=>x.id==id).pw=H('welcome123');save();toast('Password reset to welcome123')}}
function profile(id){const e=db.emp.find(x=>x.id==id);if(!isA()&&me.id!=id)return;modal(`<h3>${E(e.name)} (${e.code})</h3><p>Email: ${E(e.email)}<br>Phone: ${E(e.phone)}<br>Address: ${E(e.address)}<br>Joined: ${e.joined}<br>Department: ${E(dn(e.dept))}<br>Designation: ${E(e.desig)}<br>Status: ${e.status}</p>${btn('Close','closeM()','g')}`)}
P.emp=()=>`<h2>Employees</h2><div class="card">${btn('+ Add Employee','empAdd()')}${tbl(['ID','Name','Email','Dept','Designation','Status','Actions'],db.emp.map(e=>[e.code,E(e.name),E(e.email),E(dn(e.dept)),E(e.desig),`<span class="tag">${e.status}</span>`,btn('View',`profile(${e.id})`,'g')+btn('Edit',`empEdit(${e.id})`)+btn(e.status=='Active'?'Deactivate':'Activate',`empTog(${e.id})`,'g')+btn('Reset PW',`empRst(${e.id})`,'g')+btn('Del',`empDel(${e.id})`,'r')]),1)}</div>`;
P.prof=()=>{const e=db.emp.find(x=>x.id==me.id);return`<h2>My Profile</h2><div class="card"><h3>${E(e.name)} (${e.code})</h3><p>Email: ${E(e.email)}<br>Phone: ${E(e.phone)}<br>Address: ${E(e.address)}<br>Joined: ${e.joined}<br>Department: ${E(dn(e.dept))}<br>Designation: ${E(e.desig)}</p></div>`};
// departments
function deptF(id){const d=db.dept.find(x=>x.id==id);form(d?'Edit Department':'Add Department',[{n:'name',l:'Department name'},{n:'description',l:'Description'},{n:'desigs',l:'Designations (comma separated)'}],d,o=>{if(!o.name)return'Name required';if(db.dept.some(x=>x.name.toLowerCase()==o.name.toLowerCase()&&x.id!=id))return'Department exists';d?Object.assign(d,o):add('dept',o)})}
function deptDel(id){if(db.emp.some(e=>e.dept==id))return toast('Employees assigned - cannot delete',1);if(confirm('Delete department?')){db.dept=db.dept.filter(d=>d.id!=id);save();go('dept')}}
function deptEmps(id){modal(`<h3>${E(dn(id))} - Employees</h3>`+tbl(['ID','Name','Designation'],db.emp.filter(e=>e.dept==id).map(e=>[e.code,E(e.name),E(e.desig)]))+btn('Close','closeM()','g'))}
P.dept=()=>`<h2>Departments & Designations</h2><div class="card">${btn('+ Add Department','deptF()')}${tbl(['Department','Description','Designations','Employees','Actions'],db.dept.map(d=>[E(d.name),E(d.description||'-'),E(d.desigs),db.emp.filter(e=>e.dept==d.id).length,btn('Employees',`deptEmps(${d.id})`,'g')+btn('Edit',`deptF(${d.id})`)+btn('Delete',`deptDel(${d.id})`,'r')]))}</div>`;
// attendance

function structCalc(s){const S=db.set,n=k=>+s[k]||0,basic=n('basic'),hra=n('hra'),med=n('med'),ta=n('ta'),oa=m(n('da')+n('oth')),al=m(hra+med+ta+oa),gross=m(basic+al),
pf=m(basic*S.pf/100),esi=gross<=21000?m(gross*S.esi/100):0,pt=+S.pt,od=n('od'),td=m(pf+esi+pt+od);
return{basic,hra,med,ta,oa,al,gross,pf,esi,pt,od,td,net:m(gross-td)}}

function rdbData(){const D={departments:[],employees:[],salary:[],payroll:[]};
db.dept.forEach(d=>D.departments.push({department_id:d.id,department_name:d.name,description:d.description||''}));

db.emp.forEach(e=>{const s=sal(e.id);if(!s)return;const c=structCalc(s);D.salary.push({salary_id:s.id,employee_id:e.id,basic_salary:c.basic,hra:c.hra,medical_allowance:c.med,travel_allowance:c.ta,other_allowances:c.oa,total_allowances:c.al,gross_salary:c.gross,total_deductions:c.td,net_salary:c.net,pf_deduction:c.pf,esi_deduction:c.esi,professional_tax:c.pt,other_deductions:c.od,effective_date:s.eff})});
db.pay.slice().sort((a,b)=>a.id-b.id).forEach(p=>{const c=p.c;D.payroll.push({payroll_id:p.id,employee_id:p.emp,salary_month:p.mo,basic_salary:m(c.s.basic),total_allowances:m(c.gross-c.s.basic),gross_salary:c.gross,total_deductions:c.td,reimbursements:c.reimb||0,net_salary:c.net,payment_status:p.st=='Final'?'Paid':p.st=='Draft'?'Pending':'Reversed',payment_date:p.st=='Final'?(p.pd||lastDay(p.mo)):null})});
return D}
